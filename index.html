
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDL — Donate</title>
  <meta name="description" content="Поддержи MEDL криптовалютой.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #05080d;
      --card: #0b151f;
      --card-top: #0d1a26;
      --border: #183044;
      --blue: #08b9ff;
      --text: #f4f8fb;
      --muted: #8293a2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(8,185,255,.13), transparent 34%),
        linear-gradient(180deg, #05080d, #06101a 50%, #05080d);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(8,185,255,.35);
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 36px);
      letter-spacing: -1px;
      font-weight: 800;
    }

    .subtitle {
      max-width: 570px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .line {
      width: 46px;
      height: 2px;
      margin: 20px auto 0;
      background: var(--blue);
      box-shadow: 0 0 14px rgba(8,185,255,.45);
    }

    .choose-title {
      text-align: center;
      margin: 0 0 14px;
      color: #dce6ec;
      font-size: 14px;
      font-weight: 700;
    }

    .network-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 26px;
    }

    .network-option {
      min-height: 64px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(145deg, var(--card-top), var(--card));
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .network-option:hover {
      border-color: #28708f;
      transform: translateY(-1px);
    }

    .network-option[aria-pressed="true"] {
      border-color: var(--blue);
      background: linear-gradient(145deg, #103149, #0b1c2a);
      box-shadow: 0 0 0 1px rgba(8,185,255,.12);
    }

    .option-name {
      display: block;
      font-size: 15px;
      font-weight: 800;
    }

    .option-network {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .wallet {
      position: relative;
      padding: 26px;
      background: linear-gradient(145deg, var(--card-top), var(--card));
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
      overflow: hidden;
    }

    .wallet::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--blue), rgba(8,185,255,.15));
    }

    .wallet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .wallet-name {
      font-size: 19px;
      font-weight: 800;
    }

    .network {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .coin {
      flex-shrink: 0;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #a9bac6;
      font-size: 11px;
      font-weight: 700;
    }

    .wallet-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .qr {
      width: 250px;
      height: 250px;
      max-width: 100%;
      display: grid;
      place-items: center;
      padding: 13px;
      background: #fff;
      border: 2px solid #fff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.28);
    }

    .qr img,
    .qr canvas {
      display: block;
      width: 220px !important;
      height: 220px !important;
      max-width: 100%;
    }

    .wallet-info {
      width: 100%;
      min-width: 0;
    }

    .address-label {
      margin-bottom: 8px;
      color: #5d7181;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .address {
      padding: 13px 14px;
      background: rgba(3,7,11,.65);
      border: 1px solid #142536;
      border-radius: 11px;
      color: #dce6ec;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .copy-button {
      width: 100%;
      margin-top: 10px;
      padding: 13px 15px;
      border: 1px solid rgba(8,185,255,.25);
      border-radius: 10px;
      background: linear-gradient(180deg, #0aa8dc, #087da9);
      color: #fff;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }

    .copy-button:hover {
      filter: brightness(1.08);
    }

    .copy-button.copied {
      background: #163a4b;
      border-color: #275b72;
    }

    .note {
      margin-top: 24px;
      text-align: center;
      color: #5d7181;
      font-size: 11px;
      line-height: 1.7;
    }

    .note strong {
      color: #9aabb7;
    }

    @media (max-width: 520px) {
      .page {
        width: calc(100% - 22px);
        padding: 32px 0 42px;
      }

      header { margin-bottom: 26px; }
      .logo { width: 76px; height: 76px; }
      h1 { font-size: 27px; }
      .subtitle { font-size: 13px; }
      .network-options { gap: 9px; margin-bottom: 20px; }
      .network-option { min-height: 62px; padding: 11px; }
      .option-name { font-size: 14px; }
      .option-network { font-size: 11px; }
      .wallet { padding: 20px 16px; }
      .qr {
        width: min(250px, 100%);
        height: auto;
        aspect-ratio: 1;
      }

      .qr img,
      .qr canvas {
        width: 100% !important;
        height: 100% !important;
      }

      .address { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="logo">
        <img src="avatar.png" alt="MEDL">
      </div>

      <h1>ПОДДЕРЖИ MEDL</h1>

      <div class="subtitle">
        Если тебе нравится MEDL и ты хочешь его поддержать,
        можешь отправить донат в криптовалюте.
      </div>

      <div class="line"></div>
    </header>

    <main>
      <p class="choose-title">Выбери криптовалюту и сеть</p>

      <div class="network-options" role="group" aria-label="Выбор сети">
        <button class="network-option" type="button"
                data-wallet="bep20" aria-pressed="true">
          <span class="option-name">USDT</span>
          <span class="option-network">BEP20 · BSC</span>
        </button>

        <button class="network-option" type="button"
                data-wallet="trc20" aria-pressed="false">
          <span class="option-name">USDT</span>
          <span class="option-network">TRC20 · TRON</span>
        </button>

        <button class="network-option" type="button"
                data-wallet="erc20" aria-pressed="false">
          <span class="option-name">USDT</span>
          <span class="option-network">ERC20 · Ethereum</span>
        </button>

        <button class="network-option" type="button"
                data-wallet="btc" aria-pressed="false">
          <span class="option-name">Bitcoin</span>
          <span class="option-network">Bitcoin Network</span>
        </button>
      </div>

      <section class="wallet" aria-live="polite">
        <div class="wallet-top">
          <div>
            <div class="wallet-name" id="wallet-name">USDT</div>
            <div class="network" id="wallet-network">BEP20 · BSC</div>
          </div>
          <div class="coin" id="wallet-coin">USDT</div>
        </div>

        <div class="wallet-content">
          <div class="qr" id="wallet-qr"
               aria-label="QR-код адреса кошелька"></div>

          <div class="wallet-info">
            <div class="address-label">Адрес кошелька</div>
            <div class="address" id="wallet-address">0x1e988d51c62d285365fc78f1c06f31ef3830b540</div>
            <button class="copy-button" id="copy-button" type="button">
              Копировать адрес
            </button>
          </div>
        </div>
      </section>
    </main>

    <div class="note">
      <strong>Важно:</strong>
      перед отправкой обязательно проверь выбранную сеть и адрес кошелька.
    </div>
  </div>

  <script>
    const wallets = {
      bep20: {
        name: "USDT",
        network: "BEP20 · BSC",
        coin: "USDT",
        address: "0x1e988d51c62d285365fc78f1c06f31ef3830b540"
      },
      trc20: {
        name: "USDT",
        network: "TRC20 · TRON",
        coin: "USDT",
        address: "TF97BFSrPByYBkfmt6XL5BFJmTMyDPRsPK"
      },
      erc20: {
        name: "USDT",
        network: "ERC20 · Ethereum",
        coin: "USDT",
        address: "0x1e988d51c62d285365fc78f1c06f31ef3830b540"
      },
      btc: {
        name: "Bitcoin",
        network: "Bitcoin Network",
        coin: "BTC",
        address: "162q7iEfMdhiJJCnE2xKZ1TfWjFBLomhM"
      }
    };

    const qrContainer = document.getElementById("wallet-qr");
    const nameElement = document.getElementById("wallet-name");
    const networkElement = document.getElementById("wallet-network");
    const coinElement = document.getElementById("wallet-coin");
    const addressElement = document.getElementById("wallet-address");
    const copyButton = document.getElementById("copy-button");
    const optionButtons = document.querySelectorAll(".network-option");

    let currentWallet = "bep20";

    function showWallet(key) {
      const wallet = wallets[key];
      if (!wallet) return;

      currentWallet = key;
      nameElement.textContent = wallet.name;
      networkElement.textContent = wallet.network;
      coinElement.textContent = wallet.coin;
      addressElement.textContent = wallet.address;

      optionButtons.forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.wallet === key)
        );
      });

      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: wallet.address,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      copyButton.textContent = "Копировать адрес";
      copyButton.classList.remove("copied");
    }

    optionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        showWallet(button.dataset.wallet);
      });
    });

    copyButton.addEventListener("click", async () => {
      const address = wallets[currentWallet].address;

      try {
        await navigator.clipboard.writeText(address);
        copyButton.textContent = "Скопировано ✓";
        copyButton.classList.add("copied");

        setTimeout(() => {
          copyButton.textContent = "Копировать адрес";
          copyButton.classList.remove("copied");
        }, 1600);
      } catch (error) {
        window.prompt("Скопируй адрес кошелька:", address);
      }
    });

    showWallet("bep20");
  </script>
</body>
</html>
